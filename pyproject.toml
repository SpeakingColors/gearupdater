[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "studio87-gearupdater"
dynamic = ["version"]
description = "Studio 87 Gear Updater: lists every Studio 87 plugin and app with an update available"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = []          # PySide6 comes from the Flatpak base app, or from pip on Windows and macOS

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.gui-scripts]
studio87-gearupdater = "studio87_updater.__main__:main"

[tool.setuptools]
packages = ["studio87_updater", "studio87_updater.gui"]

[tool.setuptools.package-data]
studio87_updater = ["products.json", "assets/*"]

[tool.setuptools.dynamic]
version = { attr = "studio87_updater.__version__" }
